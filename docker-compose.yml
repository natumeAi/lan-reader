name: lan-reader

services:
  lan-reader:
    image: lshym123/lan-reader:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      EPUB_DATA_DIR: /app/server/data
      DATABASE_PATH: /app/server/data/library.sqlite
    ports:
      - "4081:3000"
    volumes:
      - ./data-lan-reader:/app/server/data
